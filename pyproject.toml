[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-ad"
version = "0.1.0"
description = "Minimal end-to-end telemetry anomaly detection pipeline for NAB and SKAB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
  "rich>=13.9",
  "seaborn>=0.13",
  "PyYAML>=6.0",
  "joblib>=1.4",
  "torch>=2.3",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["telemetry_ad*"]
