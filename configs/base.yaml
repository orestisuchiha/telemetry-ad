project:
  name: telemetry-ad

training:
  seed: 42
  window_size: 60
  stride: 1
  threshold_percentile: 99.5

advanced:
  enabled: true
  device: cpu
  epochs: 8
  batch_size: 128
  lr: 0.001
  lstm_hidden_dim: 32

preprocessing:
  resample_rule: null
  forward_fill: true
  interpolate: false
  interpolate_limit_direction: both
  ewma_alpha: null
  standardize: true

feature_engineering:
  lag_steps:
    - 1
    - 5
    - 10

inference:
  alert_min_segment_length: 3
  threshold_calibration:
    enabled: false
    warmup_windows: 0
    suppress_during_warmup: true
    default:
      mode: artifact
      percentile: 99.5
    models: {}
