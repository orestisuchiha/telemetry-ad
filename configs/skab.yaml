dataset: skab
train_file: Datasets/SKAB/anomaly-free/anomaly-free.csv
training:
  threshold_percentile: 99.0
test_files:
  primary: Datasets/SKAB/valve1/1.csv
  optional_secondary: Datasets/SKAB/valve1/2.csv
separator: ";"

split_name: anomalyfree_vs_valve1_1

default_model_set:
  - zscore
  - iforest
  - lstm_ae
  - cnn_ae

feature_engineering:
  seasonality_analysis:
    period: 60
    signal_column: Pressure

inference:
  threshold_calibration:
    enabled: true
    warmup_windows: 300
    suppress_during_warmup: true
    default:
      mode: artifact
      percentile: 99.5
    search:
      enabled: true
      optimize_metric: f1
      prefer_lower_alert_rate: true
      default_candidate_percentiles: []
      models:
        zscore:
          candidate_percentiles:
            - 10.0
            - 15.0
            - 20.0
            - 25.0
            - 30.0
            - 40.0
            - 50.0
        iforest:
          candidate_percentiles:
            - 40.0
            - 45.0
            - 50.0
            - 55.0
            - 60.0
          max_alert_rate: 0.40
        lstm_ae:
          candidate_percentiles:
            - 70.0
            - 75.0
            - 80.0
            - 85.0
            - 90.0
            - 95.0
          max_alert_rate: 0.50
        cnn_ae:
          candidate_percentiles:
            - 60.0
            - 65.0
            - 70.0
            - 75.0
            - 80.0
            - 85.0
          max_alert_rate: 0.50
    models:
      zscore:
        mode: warmup_percentile
        percentile: 10.0
      iforest:
        mode: warmup_percentile
        percentile: 50.0
      lstm_ae:
        mode: warmup_percentile
        percentile: 80.0
      cnn_ae:
        mode: warmup_percentile
        percentile: 70.0
