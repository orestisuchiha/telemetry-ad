project:
  name: telemetry-ad

training:
  seed: 42
  window_size: 60
  stride: 1
  threshold_percentile: 99.5
  model_threshold_percentiles: {}

advanced:
  enabled: true
  device: cpu
  epochs: 8
  batch_size: 128
  lr: 0.001
  lstm_hidden_dim: 32
  models: {}

preprocessing:
  resample_rule: null
  forward_fill: true
  interpolate: false
  interpolate_limit_direction: both
  rolling_detrend_window: null
  ewma_alpha: null
  standardize: true

feature_engineering:
  lag_steps:
    - 1
    - 5
    - 10
  fft:
    enabled: true
    include_dc: false
  seasonality_analysis:
    enabled: true
    period: null
    signal_column: null
    robust: true

inference:
  alert_min_segment_length: 3
  threshold_calibration:
    enabled: false
    warmup_windows: 0
    suppress_during_warmup: true
    default:
      mode: artifact
      percentile: 99.5
    search:
      enabled: false
      optimize_metric: f1
      prefer_lower_alert_rate: true
      max_alert_rate: null
      default_candidate_percentiles: []
    models: {}

interpretation:
  enabled: true
  drift_min_length: 120
  drift_length_ratio: 0.25

nonstationarity:
  enabled: true
  segment_count: 3
